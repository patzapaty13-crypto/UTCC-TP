spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/utcctp}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USER:utcctp}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:utcctp}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
