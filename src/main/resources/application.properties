server.port=${PORT:8080}
app.jwt.issuer=${JWT_ISSUER:utcctp}
app.jwt.secret=${JWT_SECRET:dev-secret-change-me}
app.jwt.expiryMinutes=${JWT_EXPIRY_MINUTES:480}
spring.jackson.serialization.indent_output=false
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false

# Storage
app.storage.provider=${STORAGE_PROVIDER:auto}
app.storage.root=${STORAGE_ROOT:uploads}

# Cloudinary
app.cloudinary.cloudName=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.uploadPreset=${CLOUDINARY_UPLOAD_PRESET:}
app.cloudinary.apiKey=${CLOUDINARY_API_KEY:}
app.cloudinary.apiSecret=${CLOUDINARY_API_SECRET:}

# AI
app.ai.provider=${AI_PROVIDER:mock}
app.ai.openai.baseUrl=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.apiKey=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Email (Resend)
app.mail.resend.apiKey=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:UTCC-TP <onboarding@resend.dev>}

# n8n webhook
app.webhook.n8n-url=${N8N_WEBHOOK_URL:https://thanathorn123.app.n8n.cloud/webhook/otp-send}

# CORS
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:*}

# File upload limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# Actuator (minimal)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
