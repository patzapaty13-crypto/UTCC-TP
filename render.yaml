services:
  - type: web
    name: utcctp-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: PORT
        value: "8080"

      # --- Secrets (set in Render dashboard) ---
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # --- Cloudinary ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: auto

      # --- Email (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "UTCC-TP <onboarding@resend.dev>"

      # --- AI / Automation ---
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

      # --- CORS ---
      - key: CORS_ALLOWED_ORIGINS
        value: "https://utcc-tp.vercel.app"
